<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2d2d2d" />
  <title>SW England Renewable Projects — Map Agent</title>

  <!-- MapLibre GL JS — drop-in for Mapbox GL JS, no token. To use Mapbox: swap
       these URLs, set mapboxgl.accessToken, rename maplibregl -> mapboxgl. -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* Palette and type follow the portfolio site: white cards on charcoal,
       near-black headings, Tailwind-ish greys, 12px radii. */
    :root {
      --shell:#2d2d2d; --card:#ffffff; --line:#e5e7eb; --line-strong:#d1d5db;
      --ink:#1a1a1a; --head:#111827; --muted:#6b7280; --wash:#f9fafb;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --sheet-radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink);
      background: var(--shell);
      -webkit-font-smoothing: antialiased;
    }

    /* 100dvh, not 100vh — mobile browser chrome otherwise crops the composer. */
    #app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; height: 100dvh; }

    #sidebar { background: var(--card); display: flex; flex-direction: column; min-height: 0; }

    #sidebar header { padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
    #sidebar header h1 {
      font-size: 17px; font-weight: 800; color: var(--head);
      letter-spacing: -0.4px; line-height: 1.25;
    }
    .tagline { margin-top: 6px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }

    /* Grab handle — only rendered as a control on mobile. */
    #grip { display: none; }

    /* Collapsed-sheet one-liner: the latest answer, so the map stays visible. */
    #peek { display: none; }

    #log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
    .msg { padding: 10px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.55; max-width: 90%; white-space: pre-wrap; }
    .user { background: var(--head); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; font-weight: 500; }
    .assistant { background: var(--wash); border: 1px solid var(--line); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; }
    .status { color: var(--muted); font-size: 12.5px; font-style: italic; align-self: flex-start; padding: 2px 4px; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; align-self: flex-start; }

    #examples { padding: 0 16px 12px; display: flex; flex-wrap: wrap; gap: 7px; }
    #examples button {
      background: #fff; border: 1px solid var(--line); color: var(--muted);
      border-radius: 999px; padding: 7px 12px; font-size: 11.5px; font-weight: 500;
      cursor: pointer; font-family: inherit; transition: all 0.2s var(--ease);
    }
    #examples button:hover { border-color: var(--head); color: var(--head); }

    #composer {
      display: flex; gap: 9px; padding: 14px 16px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line); background: var(--card);
    }
    #composer input {
      flex: 1; min-width: 0; background: #fff; border: 2px solid var(--line);
      color: var(--ink); border-radius: 10px; padding: 11px 13px;
      /* 16px keeps iOS Safari from zooming the viewport on focus. */
      font-size: 16px; font-family: inherit; outline: none;
      transition: border-color 0.2s var(--ease);
    }
    #composer input:focus { border-color: var(--head); }
    #composer button {
      background: var(--head); color: #fff; border: 0; border-radius: 10px;
      padding: 0 18px; font-size: 13.5px; font-weight: 600; cursor: pointer;
      font-family: inherit; min-height: 44px; transition: opacity 0.2s var(--ease);
    }
    #composer button:disabled { opacity: 0.45; cursor: default; }

    #mapwrap { position: relative; min-height: 0; }
    #map { position: absolute; inset: 0; }
    #legend {
      position: absolute; bottom: 18px; left: 18px; background: rgba(255,255,255,.94);
      backdrop-filter: blur(6px); color: var(--ink); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 14px; font-size: 11.5px; line-height: 1.8; z-index: 2;
      box-shadow: 0 8px 24px rgba(0,0,0,.10);
    }
    #legend b { font-size: 11px; font-weight: 700; color: var(--head); display: block; margin-bottom: 5px;
                text-transform: uppercase; letter-spacing: 0.5px; }
    #legend .row { display: flex; align-items: center; gap: 7px; }
    #legend .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    #legend hr { border: 0; border-top: 1px solid var(--line); margin: 7px 0; }

    .maplibregl-popup-content { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; line-height: 1.55;
                                padding: 12px 14px; border-radius: 12px; }
    .pop-title { font-weight: 700; font-size: 13px; margin-bottom: 5px; color: var(--head); }
    .pop-row { color: #374151; }
    .pop-tag { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 11px; color: #fff; font-weight: 500; }

    /* ---------- Mobile: map fills the screen, chat is a bottom sheet ----------
       A 380px sidebar on a 390px phone leaves no map at all, so below 768px the
       map goes full-bleed and the chat becomes a sheet that collapses to just
       its composer — the point of this app is watching the map react. */
    @media (max-width: 768px) {
      #app { display: block; position: relative; }
      #mapwrap { position: absolute; inset: 0; }

      #sidebar {
        position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
        max-height: 72dvh;
        border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
        box-shadow: 0 -8px 32px rgba(0,0,0,.28);
        transition: max-height 0.32s var(--ease);
      }

      #grip {
        display: block; width: 100%; border: 0; background: transparent;
        padding: 9px 0 3px; cursor: pointer; touch-action: manipulation;
      }
      #grip::before {
        content: ""; display: block; width: 40px; height: 4px; margin: 0 auto;
        border-radius: 999px; background: var(--line-strong);
      }

      #sidebar header { padding: 4px 18px 12px; }
      #sidebar header h1 { font-size: 15px; }
      .tagline { font-size: 12px; }

      /* Chips scroll sideways rather than stacking and eating the map. */
      #examples { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 0 16px 10px; }
      #examples::-webkit-scrollbar { display: none; }
      #examples button { flex: 0 0 auto; }

      #log { padding: 12px 16px; }
      #legend { bottom: auto; top: 14px; left: 14px; padding: 9px 11px; font-size: 10.5px; line-height: 1.65; }
      #legend .dot { width: 9px; height: 9px; }

      /* Collapsed: composer + the latest answer only, so the map is readable. */
      #sidebar.collapsed { max-height: none; }
      #sidebar.collapsed .tagline,
      #sidebar.collapsed #log,
      #sidebar.collapsed #examples { display: none; }
      #sidebar.collapsed header { border-bottom: 0; padding-bottom: 8px; }
      #sidebar.collapsed #peek {
        display: block; padding: 0 18px 10px; font-size: 12.5px; color: var(--muted);
        line-height: 1.5; overflow: hidden; text-overflow: ellipsis;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      }
      #sidebar.collapsed #peek:empty { display: none; }
    }

    /* Short landscape phones: give the sheet less room still. */
    @media (max-width: 768px) and (max-height: 480px) {
      #sidebar { max-height: 80dvh; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <button id="grip" aria-label="Expand or collapse the chat panel" aria-expanded="true"></button>
      <header>
        <h1>⚡ SW England Renewable Projects</h1>
        <p class="tagline">Renewable-energy projects across South West England — public REPD data (solar, wind, battery, hydro, biomass). Ask me to find them, filter by development stage, and analyse them.</p>
      </header>
      <div id="peek"></div>
      <div id="log"></div>
      <div id="examples"></div>
      <form id="composer">
        <input id="input" autocomplete="off" placeholder="e.g. operational solar over 10 MW" />
        <button id="send" type="submit">Send</button>
      </form>
    </div>
    <div id="mapwrap">
      <div id="map"></div>
      <div id="legend"></div>
    </div>
  </div>

  <script>
    const TECH = {
      solar_ground: "#f1c40f", solar_rooftop: "#f39c12", wind: "#3498db",
      bess: "#9b59b6", hydro: "#1abc9c", biomass: "#2ecc71",
    };
    const TECH_LABEL = {
      solar_ground: "Ground solar", solar_rooftop: "Rooftop solar", wind: "Wind",
      bess: "Battery", hydro: "Hydro", biomass: "Biomass",
    };
    const STATUS_LABEL = {
      operational: "Operational", under_construction: "Under construction",
      awaiting_construction: "Awaiting construction", submitted: "Application submitted",
    };
    const STATUS_COLOR = {
      operational: "#2ecc71", under_construction: "#e67e22",
      awaiting_construction: "#3498db", submitted: "#8a93a3",
    };

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [-3.2, 50.9],   // South West England
      zoom: 8,
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");

    const layers = new Set();

    function removeLayer(id) {
      [id, id + "-outline"].forEach(l => { if (map.getLayer(l)) map.removeLayer(l); });
      if (map.getSource(id)) map.removeSource(id);
      layers.delete(id);
    }

    function addGeojsonLayer({ layer_id, geojson, geom_type, color }) {
      removeLayer(layer_id);
      map.addSource(layer_id, { type: "geojson", data: geojson });
      if (geom_type === "fill") {
        map.addLayer({ id: layer_id, type: "fill", source: layer_id,
          paint: { "fill-color": color, "fill-opacity": 0.18 } });
        map.addLayer({ id: layer_id + "-outline", type: "line", source: layer_id,
          paint: { "line-color": color, "line-width": 2 } });
      } else {
        map.addLayer({ id: layer_id, type: "circle", source: layer_id,
          paint: { "circle-radius": 6, "circle-color": color, "circle-stroke-width": 1.5, "circle-stroke-color": "#fff" } });
      }
      layers.add(layer_id);
    }

    // Projects: colour = technology (per-feature 'color'), size = capacity (MW).
    function addProjects({ layer_id, geojson }) {
      removeLayer(layer_id);
      map.addSource(layer_id, { type: "geojson", data: geojson });
      map.addLayer({
        id: layer_id, type: "circle", source: layer_id,
        paint: {
          "circle-color": ["get", "color"],
          "circle-stroke-color": "#fff",
          "circle-stroke-width": 1.5,
          "circle-radius": ["interpolate", ["linear"],
            ["coalesce", ["get", "capacity_mw"], 3], 0, 6, 10, 12, 100, 28],
          "circle-opacity": 0.85,
        },
      });
      map.on("click", layer_id, (e) => popupFor(e.features[0], e.lngLat));
      map.on("mouseenter", layer_id, () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", layer_id, () => map.getCanvas().style.cursor = "");
      layers.add(layer_id);
    }

    function popupFor(f, lngLat) {
      const p = f.properties;
      const color = p.color || "#888";
      const mw = (p.capacity_mw != null && p.capacity_mw !== "") ? `${(+p.capacity_mw).toFixed(1)} MW` : "—";
      const status = p.status
        ? `<span class="pop-tag" style="background:${STATUS_COLOR[p.status] || '#888'}">${STATUS_LABEL[p.status] || p.status}</span>` : "";
      new maplibregl.Popup({ maxWidth: "260px" }).setLngLat(lngLat).setHTML(
        `<div class="pop-title">${p.title}</div>
         <div class="pop-row"><span class="pop-tag" style="background:${color}">${TECH_LABEL[p.technology] || p.technology}</span> · ${mw}</div>
         <div class="pop-row">${p.county || ""}${p.operator ? " · " + p.operator : ""}</div>
         ${status ? `<div class="pop-row" style="margin-top:4px">${status}</div>` : ""}
         <div class="pop-row" style="color:#888;margin-top:4px">REPD ref ${p.ref_id || "—"}</div>`
      ).addTo(map);
    }

    // Fitting bounds must clear the bottom sheet on mobile, or results land
    // underneath it.
    function fitPadding() {
      if (!isMobile()) return 70;
      const sheet = sidebar.getBoundingClientRect().height;
      return { top: 60, left: 30, right: 30, bottom: Math.min(sheet + 20, window.innerHeight * 0.55) };
    }

    function runMapCommand(cmd) {
      const a = cmd.args || {};
      switch (cmd.command) {
        case "fly_to": map.flyTo({ center: [a.longitude, a.latitude], zoom: a.zoom ?? 12 }); break;
        case "fit_bounds": { const [w, s, e, n] = a.bbox;
          map.fitBounds([[w, s], [e, n]], { padding: fitPadding(), maxZoom: 13, duration: 800 }); break; }
        case "add_projects": addProjects(a); break;
        case "add_geojson_layer": addGeojsonLayer(a); break;
        case "set_layer_color":
          if (map.getLayer(a.layer_id)) {
            const t = map.getLayer(a.layer_id).type;
            map.setPaintProperty(a.layer_id, t === "fill" ? "fill-color" : "circle-color", a.color);
            if (map.getLayer(a.layer_id + "-outline")) map.setPaintProperty(a.layer_id + "-outline", "line-color", a.color);
          } break;
        case "set_layer_visibility": {
          const v = a.visible ? "visible" : "none";
          [a.layer_id, a.layer_id + "-outline"].forEach(l => { if (map.getLayer(l)) map.setLayoutProperty(l, "visibility", v); });
          break; }
        case "clear": [...layers].forEach(removeLayer); break;
      }
    }

    // ---- Legend ----
    document.getElementById("legend").innerHTML =
      "<b>Technology</b>" +
      Object.keys(TECH_LABEL).map(k =>
        `<div class="row"><span class="dot" style="background:${TECH[k]}"></span>${TECH_LABEL[k]}</div>`).join("") +
      "<hr><div style='color:#6b7280'>size = capacity (MW)</div>";

    // ---- Chat + websocket ----
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const form = document.getElementById("composer");
    const sendBtn = document.getElementById("send");
    const sidebar = document.getElementById("sidebar");
    const grip = document.getElementById("grip");
    const peek = document.getElementById("peek");

    const isMobile = () => window.matchMedia("(max-width: 768px)").matches;

    function setCollapsed(on) {
      sidebar.classList.toggle("collapsed", on);
      grip.setAttribute("aria-expanded", String(!on));
    }
    grip.addEventListener("click", () => setCollapsed(!sidebar.classList.contains("collapsed")));

    function bubble(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls; div.textContent = text;
      log.appendChild(div); log.scrollTop = log.scrollHeight;
      if (cls === "assistant" || cls === "error") peek.textContent = text;
    }

    let socket, busy = false;
    function connect() {
      // wss:// behind TLS — a hardcoded ws:// is blocked as mixed content on https.
      const scheme = location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(`${scheme}//${location.host}/ws`);
      socket.onmessage = (ev) => {
        const m = JSON.parse(ev.data);
        if (m.type === "assistant_text") bubble(m.text, "assistant");
        else if (m.type === "status") bubble(m.text, "status");
        else if (m.type === "error") bubble(m.text, "error");
        else if (m.type === "map_command") runMapCommand(m);
        else if (m.type === "done") {
          busy = false; sendBtn.disabled = false; input.disabled = false;
          if (isMobile()) {
            // Drop the sheet so the map — which just changed — is visible, and
            // don't refocus: that would reopen the keyboard over the result.
            setCollapsed(true);
          } else {
            input.focus();
          }
        }
      };
      socket.onclose = () => setTimeout(connect, 1000);
    }
    connect();

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy || socket.readyState !== WebSocket.OPEN) return;
      bubble(text, "user");
      socket.send(JSON.stringify({ type: "user_message", text }));
      input.value = ""; busy = true; sendBtn.disabled = true; input.disabled = true;
      if (isMobile()) { setCollapsed(false); input.blur(); }
    });

    const examples = [
      "Show all operational solar",
      "Projects within 25km of Exeter",
      "Biggest battery storage projects",
      "Break down projects by county",
      "Submitted wind projects over 20 MW",
      "Clear the map",
    ];
    const exBox = document.getElementById("examples");
    examples.forEach((t) => {
      const b = document.createElement("button");
      b.textContent = t;
      b.onclick = () => { input.value = t; form.requestSubmit(); };
      exBox.appendChild(b);
    });

    // Start collapsed on a phone: the map should be the first thing seen.
    if (isMobile()) setCollapsed(true);
  </script>
</body>
</html>
