services:
  db:
    image: postgis/postgis:16-3.4
    container_name: netzero-map-postgis
    environment:
      POSTGRES_USER: map
      POSTGRES_PASSWORD: map
      POSTGRES_DB: map
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U map -d map"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
