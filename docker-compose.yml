services:
  # Local development. The deployed app runs on Fly — see fly.toml.
  app:
    build: .
    container_name: netzero-map-app
    ports:
      - "8000:8000"
    env_file:
      - backend/.env          # GROQ_API_KEY
    environment:
      # Overrides the localhost DSN in backend/.env — inside the compose
      # network the database is reachable by service name.
      DATABASE_URL: postgresql://map:map@db:5432/map
      RATE_LIMIT_PER_MINUTE: "5"
      DAILY_TURN_BUDGET: "15"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    container_name: netzero-map-postgis
    environment:
      POSTGRES_USER: map
      POSTGRES_PASSWORD: map
      POSTGRES_DB: map
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U map -d map"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
