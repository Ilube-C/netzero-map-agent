# FastAPI app + static frontend.
# Secrets (set with `flyctl secrets set`, never committed):
#   GROQ_API_KEY   the model key
#   DATABASE_URL   postgresql://map:<pw>@netzero-map-db.internal:5432/map
app = "netzero-map-agent"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Gemini's OpenAI-compatible endpoint. Groq's free tier caps at 100k tokens
  # a day (~16 turns) and its console rejects the account's email domain, so
  # the tier could not be raised; Gemini's free tier allows ~1500 requests a
  # day with no daily token ceiling.
  OPENAI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai/"
  GROQ_MODEL = "gemini-3.6-flash"
  # Public demo guardrails — see backend/app/limits.py. Sized to Gemini's free
  # tier: ~1500 requests/day and 10 requests/minute. A tool-using turn costs
  # 2-3 requests, so ~400 turns a day and ~4 a minute keep us inside it.
  RATE_LIMIT_PER_MINUTE = "4"
  DAILY_TURN_BUDGET = "400"
  MAX_MESSAGE_CHARS = "500"

[http_service]
  internal_port = 8000
  force_https = true
  # 24/7: never suspend, and always keep one machine running. Scale-to-zero
  # would drop the websocket and add a cold start to the first question.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  # 256mb is ample: uvicorn + asyncpg + an httpx client. The database is the
  # side that wants headroom, and it gets 512mb in deploy/postgis/fly.toml.
  memory = "256mb"
